name: Bug report
description: Report reproducible FastPAS behavior without disclosing tenant secrets.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Never include passwords, tokens, client secrets, profile files, or unredacted tenant exports.
  - type: input
    id: version
    attributes:
      label: FastPAS version or commit
    validations:
      required: true
  - type: input
    id: powershell
    attributes:
      label: PowerShell version
      placeholder: 7.5.0
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command ID
      placeholder: account.inventory
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and sanitized error
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: checkboxes
    id: sanitation
    attributes:
      label: Data safety
      options:
        - label: I removed passwords, tokens, client secrets, profile data, and identifying tenant content.
          required: true

